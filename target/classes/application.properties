# Puerto
server.port=8080

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:helpdeskdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2 (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (se usarán en la siguiente parte: autenticación)
jwt.secret=cambia-esta-clave-por-una-secreta-de-al-menos-32-caracteres
jwt.access-token.expiracion-minutos=15
jwt.refresh-token.expiracion-dias=7
